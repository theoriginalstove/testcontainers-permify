name: Update Permify Version

on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: "0 9 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Get latest Permify release
        id: latest-release
        run: |
          API_URL="https://api.github.com/repos/permify/permify/releases/latest"
          AUTH_HEADER="Authorization: Bearer $GITHUB_TOKEN"
          RESPONSE=$(curl -s -w "%{http_code}" -H "$AUTH_HEADER" "$API_URL")
          HTTP_STATUS="${RESPONSE: -3}"
          BODY="${RESPONSE::-3}"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Error: GitHub API request failed with status $HTTP_STATUS"
            echo "Response: $BODY"
            exit 1
          fi
          LATEST_VERSION=$(echo "$BODY" | jq -r .tag_name)
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "Error: Could not extract latest version from GitHub API response."
            echo "Response: $BODY"
            exit 1
          fi
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "Latest Permify version: $LATEST_VERSION"

      - name: Get current version
        id: current-version
        run: |
          CURRENT_VERSION=$(grep -oP 'defaultPermifyImageVersion\s*=\s*"\K[^"]+' permify.go)
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current version in code: $CURRENT_VERSION"

      - name: Check if update is needed
        id: check-update
        run: |
          if [ "${{ steps.latest-release.outputs.version }}" != "${{ steps.current-version.outputs.version }}" ]; then
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "Update needed: ${{ steps.current-version.outputs.version }} -> ${{ steps.latest-release.outputs.version }}"
          else
            echo "update_needed=false" >> $GITHUB_OUTPUT
            echo "Already up to date!"
          fi

      - name: Update version in permify.go
        if: steps.check-update.outputs.update_needed == 'true'
        run: |
          sed -i 's/defaultPermifyImageVersion = ".*"/defaultPermifyImageVersion = "${{ steps.latest-release.outputs.version }}"/' permify.go
          cat permify.go | grep defaultPermifyImageVersion

      - name: Create Pull Request
        if: steps.check-update.outputs.update_needed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: update Permify version to ${{ steps.latest-release.outputs.version }}

            Updates defaultPermifyImageVersion from ${{ steps.current-version.outputs.version }} to ${{ steps.latest-release.outputs.version }}
          branch: update-permify-${{ steps.latest-release.outputs.version }}
          delete-branch: true
          title: "chore: update Permify version to ${{ steps.latest-release.outputs.version }}"
          body: |
            ## Update Permify Version

            This PR updates the Permify container image version to the latest release.

            **Changes:**
            - Update `defaultPermifyImageVersion` from `${{ steps.current-version.outputs.version }}` to `${{ steps.latest-release.outputs.version }}`

            **Release Notes:**
            See [Permify Release ${{ steps.latest-release.outputs.version }}](https://github.com/Permify/permify/releases/tag/${{ steps.latest-release.outputs.version }})

            ---
            *This PR was automatically generated by the Update Permify Version workflow.*
          labels: |
            dependencies
            automated
          assignees: ${{ github.repository_owner }}
